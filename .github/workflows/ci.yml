name: EBS MCP Server CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # بيسرع تحميل الـ packages في المرات الجاية

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit flake8

    - name: Check Syntax and Style (Flake8)
      run: |
        # فحص سريع لترتيب الكود والأخطاء الواضحة في مجلد src
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Prepare Environment Variables
      run: |
        # إنشاء ملف .env وهمي من الـ example عشان الـ config.py ميضربش error وقت التست
        cp .env.example .env

    - name: Run Unit Tests
      run: |
        # تشغيل ملف الاختبارات الخاص بيك
        python run_tests.py

    - name: Run Security Scan (Bandit)
      run: |
        # فحص الكود أمنياً للتأكد من عدم وجود ثغرات
        bandit -r src/ -ll